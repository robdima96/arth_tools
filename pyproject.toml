[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arth-tools"
version = "0.2.0"
description = "Arthritis imaging tools: DICOM prepare/train/eval and standing x-ray HKA."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "robdima96" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pydicom>=2.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "optuna>=3.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
resnet = ["transformers>=4.40"]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.32"]

[project.urls]
Repository = "https://github.com/robdima96/arth_tools"

[project.scripts]
arth-tools = "arth_tools.__main__:main"

[tool.setuptools.packages.find]
include = ["arth_tools*"]

[tool.setuptools.package-data]
arth_tools = ["roi/cfgs/*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
